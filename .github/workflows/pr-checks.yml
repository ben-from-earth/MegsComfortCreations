name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: |
          for attempt in 1 2 3; do
            if npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000; then
              exit 0
            fi
            echo "npm ci failed on attempt ${attempt}, retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Lint
        run: npm run lint

      - name: App Typecheck
        run: npm run typecheck

      - name: Test Typecheck
        run: npx tsc -p __tests__/tsconfig.json --noEmit

      - name: Tests
        run: npm test
